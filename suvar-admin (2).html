<style>
:root{
 --ink:#f4f4f8;--mute:rgba(244,244,248,.62);--faint:rgba(244,244,248,.4);--fill:rgba(255,255,255,.07);--fill2:rgba(255,255,255,.14);--line:rgba(255,255,255,.14);

 color-scheme:dark}

 --gshadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(120,126,150,.16),0 30px 50px -30px rgba(58,64,90,.38),0 10px 18px -12px rgba(58,64,90,.2);
 --r1:rgba(255,255,255,.98);--r2:rgba(255,255,255,.14);--selbg:linear-gradient(180deg,#484b58,#22232b);--selink:#fff;--inp:rgba(255,255,255,.75);
 --sheet:linear-gradient(150deg,rgba(255,255,255,.98),rgba(238,238,246,.97));--t1:#15151c;--t2:#5b5870;--popbg:#fff;--red:#d2453d;--amber:#b7791a;
 --bgimg:radial-gradient(52% 36% at 6% 3%,rgba(255,255,255,.98),transparent 70%),radial-gradient(42% 30% at 102% 12%,rgba(155,92,246,.28),transparent 72%),radial-gradient(46% 34% at -4% 72%,rgba(217,68,156,.2),transparent 72%),radial-gradient(42% 28% at 88% 102%,rgba(99,102,241,.22),transparent 72%),linear-gradient(170deg,#f1f0f4,#dedde5 50%,#ebeaef);color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;font:14px/1.5 var(--body);color:var(--ink);background:#07070b;min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0)}
[data-theme=light] body{background:#e4e3ea}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bgimg)}
.bg::after{content:"";position:absolute;inset:0;background:var(--grain);opacity:.12;mix-blend-mode:screen}

h1,h2,h3,h4,p,ul{margin:0}ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
*{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.3);backdrop-filter:blur(24px) saturate(1.3);box-shadow:var(--gshadow);border-radius:24px}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(140deg,var(--r1),var(--r2) 38%,var(--r2) 62%,var(--r1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}

.disp{font-family:var(--disp);font-style:italic;font-weight:900;text-transform:uppercase;line-height:.92}

.logo{font-family:var(--disp);font-style:italic;font-weight:900;font-size:2rem;letter-spacing:.01em;color:var(--ink);text-shadow:0 0 26px rgba(155,92,246,.8);line-height:1;text-decoration:none}
/* buttons */
.btn,.ib,.seg button,.chip{transition:transform .35s var(--ease),background-color .25s,filter .25s,box-shadow .3s;-webkit-tap-highlight-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-weight:600;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);text-decoration:none}
.btn.p{background:var(--grad);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 26px -10px rgba(155,92,246,.75)}
.btn.w{background:var(--selbg);color:var(--selink);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 20px -12px rgba(0,0,0,.7)}
.btn.d{color:var(--red)}.btn.sm{height:30px;padding:0 13px;font-size:.7rem}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn:active,.ib:active{transform:scale(.96)}
@media(hover:hover){.btn:hover{transform:scale(1.03);filter:brightness(1.1)}.ib:hover{background:var(--fill2)}.tbl tr.cl:hover{background:var(--fill)}}
.ib{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.ib i{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink)}
.ib.burger{display:none}
/* shell */
.app{display:grid;grid-template-columns:244px 1fr;gap:16px;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));max-width:1680px;margin:auto}
.side{position:sticky;top:16px;height:calc(100vh - 32px);display:flex;flex-direction:column;padding:18px 12px;overflow:hidden;border-radius:32px}
.sidelogo{padding:6px 12px 14px;display:flex;align-items:center;gap:10px}
.sidelogo small{font:500 9px var(--mono);letter-spacing:.2em;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:3px 8px}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav .sec{font:500 .66rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:999px;color:var(--mute);text-decoration:none;transition:all .3s var(--ease)}
.nav a .n{margin-left:auto;font-size:11px;background:var(--grad);color:#fff;padding:1px 8px;border-radius:99px;font-weight:700}
.nav a.on{background:var(--selbg);color:var(--selink);box-shadow:0 10px 18px -10px rgba(0,0,0,.8);font-weight:600}
@media(hover:hover){.nav a:not(.on):hover{background:var(--fill2);color:var(--ink);transform:translateX(2px)}}
.me{display:flex;gap:10px;align-items:center;padding:12px 8px 2px;border-top:1px solid var(--line);margin-top:8px}
.av{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.me b{display:block;font-weight:600;font-size:13px}.me span{font-size:11px;color:var(--mute)}
.lgo{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--mute)}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;position:sticky;top:16px;z-index:30;border-radius:999px}
.srch{flex:1;max-width:440px;display:flex;align-items:center;gap:8px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:0 14px;height:40px;color:var(--faint);white-space:nowrap;overflow:hidden;text-align:left}
.srch kbd{margin-left:auto;font:500 10px var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:0 14px;height:40px;border-radius:999px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;font-size:13px}
.view{display:flex;flex-direction:column;gap:16px;min-width:0}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{font-family:var(--disp);font-style:italic;font-weight:900;text-transform:uppercase;font-size:clamp(2.2rem,5vw,3.2rem);line-height:.92}
.ph p{margin-top:6px;color:var(--mute)}.ph .sp{flex:1}
.card{padding:20px;min-width:0}
.card h3{font-size:15px;font-weight:600;margin-bottom:2px}
.card .sub{color:var(--mute);font-size:12px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.7fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.ge{grid-template-columns:1fr 1fr}
.kpi .l{font:500 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.kpi .v{font-family:var(--disp);font-style:italic;font-weight:900;font-size:2.5rem;line-height:1.05;margin:8px 0 4px;white-space:nowrap}
.kpi .d{font-size:12px;display:flex;gap:6px;align-items:center}
.up{color:var(--ok)}.dn{color:var(--red)}
.spark{height:34px;width:100%;margin-top:8px}
/* segmented */
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none;gap:2px}.seg::-webkit-scrollbar{display:none}
.seg button{height:34px;padding:0 15px;border-radius:999px;color:var(--mute);white-space:nowrap;font-size:.85rem;font-weight:500}
.seg button.on{background:var(--selbg);color:var(--selink);box-shadow:0 8px 14px -8px rgba(0,0,0,.7)}
.seg .c{font-size:11px;opacity:.7;margin-left:5px}
/* table */
.tw{overflow-x:auto;margin:0 -6px;padding:0 6px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font:500 .66rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:8px 10px;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr.cl{cursor:pointer}td.r,th.r{text-align:right}
.bd{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.02em}
.b-g{background:rgba(47,191,128,.15);color:var(--ok)}.b-a{background:rgba(224,160,42,.16);color:var(--amber)}.b-b{background:rgba(99,102,241,.2);color:#9ea3ff}.b-r{background:rgba(255,107,107,.16);color:var(--red)}.b-n{background:var(--fill2);color:var(--mute)}.b-k{background:var(--grad);color:#fff}
[data-theme=light] .b-b{color:#4547c9}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}.dot.r{background:var(--red);box-shadow:0 0 8px var(--red)}.dot.a{background:var(--amber);box-shadow:0 0 8px var(--amber)}.dot.g{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.thumb{width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-style:italic;font-weight:900;font-size:18px;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.cell{display:flex;align-items:center;gap:10px}.cell b{font-weight:600;display:block}.cell span{font-size:12px;color:var(--mute)}
/* forms */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}.f>label{font-size:.78rem;color:var(--mute)}
.in,.ta{height:42px;border-radius:14px;border:0;background:var(--inp);box-shadow:inset 0 0 0 1px var(--line);padding:0 14px;width:100%;outline:none;transition:box-shadow .2s}
.ta{height:auto;padding:12px 14px;resize:vertical;min-height:84px}
.in:focus,.ta:focus{box-shadow:inset 0 0 0 2px var(--violet)}.in.bad{box-shadow:inset 0 0 0 2px var(--red)}
.em{color:var(--red);font-size:11.5px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dd{position:relative}.dd>button{width:100%;height:42px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:14px;background:var(--inp);box-shadow:inset 0 0 0 1px var(--line);padding:0 14px;white-space:nowrap}
.pop{position:fixed;z-index:90;background:var(--popbg);border-radius:18px;box-shadow:0 24px 50px -10px rgba(0,0,0,.6),inset 0 0 0 1px var(--line);padding:5px;max-height:300px;overflow:auto;animation:pin .2s var(--ease)}
.pop button{display:flex;width:100%;text-align:left;padding:9px 12px;border-radius:12px;gap:8px;align-items:center;white-space:nowrap}
.pop button.on{background:var(--selbg);color:var(--selink)}
@media(hover:hover){.pop button:not(.on):hover{background:var(--fill2)}}
@keyframes pin{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.sw{display:inline-block;cursor:pointer;width:44px;height:25px;border-radius:99px;background:var(--fill2);box-shadow:inset 0 0 0 1px var(--line);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .35s var(--ease)}
.sw.on{background:var(--grad)}.sw.on::after{transform:translateX(19px)}
.cb{width:19px;height:19px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--faint);display:inline-grid;place-items:center;flex:none;cursor:pointer}
.cb.on{background:var(--grad);box-shadow:none}.cb.on::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.stp{display:inline-flex;align-items:center;border-radius:999px;background:var(--inp);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.stp button{width:30px;height:32px;font-size:16px}.stp input{width:48px;text-align:center;border:0;outline:0;height:32px;background:none}
.stp.low{box-shadow:inset 0 0 0 1.5px var(--amber)}.stp.out{box-shadow:inset 0 0 0 1.5px var(--red)}
.bar{height:8px;border-radius:9px;background:var(--fill2);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--grad)}
.chart{position:relative}.chart svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--selbg);color:var(--selink);padding:6px 11px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;transform:translate(-50%,-130%);z-index:5}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
/* overlays */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;animation:fade .2s}
.ov.right{place-items:stretch end;padding:10px}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;background:var(--sheet);animation:pin .3s var(--ease)}
.drawer{width:min(460px,100%);height:100%;overflow:auto;padding:24px;background:var(--sheet);animation:slide .4s var(--ease)}
.modal h2,.drawer h2{font-family:var(--disp);font-style:italic;font-weight:900;text-transform:uppercase;font-size:2rem;line-height:1;margin-bottom:6px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(40px);opacity:0}}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:120;padding:12px 20px;border-radius:999px;animation:pin .3s var(--ease);display:flex;gap:9px;align-items:center;max-width:calc(100% - 32px);background:var(--selbg);color:var(--selink);font-weight:600;font-size:.88rem;box-shadow:0 14px 30px -10px rgba(0,0,0,.6)}
.savebar{position:sticky;bottom:16px;z-index:25;display:flex;gap:10px;align-items:center;padding:10px 16px;border-radius:999px}
.empty{padding:36px;text-align:center;color:var(--mute)}
.pg{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;color:var(--mute);font-size:12px;flex-wrap:wrap}
.step{display:flex;margin:8px 0 4px;overflow-x:auto}
.step div{flex:1;min-width:90px;text-align:center;font-size:12px;color:var(--faint);position:relative;padding-top:26px}
.step div::before{content:"";position:absolute;top:6px;left:50%;width:14px;height:14px;border-radius:50%;background:var(--inp);box-shadow:inset 0 0 0 2px var(--faint);transform:translateX(-50%);z-index:1}
.step div::after{content:"";position:absolute;top:12px;left:-50%;width:100%;height:2px;background:var(--faint);opacity:.3}
.step div:first-child::after{display:none}
.step div.done{color:var(--ink)}.step div.done::before{background:var(--grad);box-shadow:none}.step div.done::after{background:var(--grad);opacity:1}
.step div.cur::before{box-shadow:0 0 0 5px rgba(155,92,246,.3)}
.tl{display:flex;flex-direction:column;gap:12px;padding-left:16px;border-left:2px solid var(--line)}
.tl div{position:relative;font-size:13px}.tl div::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--grad)}
.tl small{display:block;color:var(--faint);font-size:11.5px}
.mq{overflow:hidden;white-space:nowrap;border-radius:999px;padding:10px 0;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);font:500 .72rem var(--mono);letter-spacing:.16em;text-transform:uppercase}
.mq span{display:inline-block;padding-left:100%;animation:mq 30s linear infinite}@keyframes mq{to{transform:translateX(-100%)}}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.li .g{flex:1;min-width:0}.li .g b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .g span{font-size:12px;color:var(--mute)}
.lk{background:none;border:0;color:var(--mute);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
/* product preview card */
.pv{border-radius:26px;padding:12px;background:var(--glass);box-shadow:var(--gshadow);max-width:300px;margin-inline:auto}

.pv .ph1 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
